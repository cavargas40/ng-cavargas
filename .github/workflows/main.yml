name: CI

on:
  push:
    branches: [ master ]

jobs:
  firebase-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    - name: npm install
      run: npm ci
    - name: npm build prod
      run: npm run build-prod
    - uses: w9jds/firebase-action@master
      with:
        args: deploy --only hosting
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
