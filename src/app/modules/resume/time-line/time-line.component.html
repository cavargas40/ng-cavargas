<div class="timeline">
  <article
    class="timeline__card terminal-card"
    *ngFor="let time of formattedTimeline"
  >
    <div class="timeline__meta font-mono-code">
      <span class="timeline__period phosphor-text font-bold">
        {{ timeline[time].title | translate }}
      </span>
      <span class="timeline__company text-muted">
        {{ timeline[time].data.company | translate }}
      </span>
    </div>

    <div class="timeline__body">
      <h3 class="timeline__position">
        {{ timeline[time].data.position | translate }}
      </h3>
      <p
        class="timeline__description"
        *ngIf="timeline[time].data.description"
      >
        {{ timeline[time].data.description | translate }}
      </p>
      <ul
        class="timeline__tags font-mono-code"
        *ngIf="timeline[time].data.tags && timeline[time].data.tags.length"
      >
        <li
          class="phosphor-pill"
          *ngFor="let tag of timeline[time].data.tags"
        >
          {{ tag }}
        </li>
      </ul>
    </div>
  </article>
</div>
