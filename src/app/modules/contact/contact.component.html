<section class="story-chapter contact-chapter section-shell" id="ch-04-transmission" appReveal>
  <div class="chapter-node contact__node"></div>

  <div class="contact__chapter-tag font-mono-code stagger-item">
    {{ 'STORY.CHAPTER_04.TAG' | translate }}
  </div>

  <div class="contact__header stagger-item">
    <h2
      class="contact__title font-bold"
      [appMatrixDecode]="'STORY.CHAPTER_04.TITLE' | translate"
      [decodeDuration]="350"
    >
      {{ 'STORY.CHAPTER_04.TITLE' | translate }}
    </h2>
    <p class="contact__subtitle">
      {{ 'STORY.CHAPTER_04.SUBTITLE' | translate }}
    </p>
  </div>

  <div class="terminal-card contact__dossier phosphor-border stagger-item">
    <div class="contact__availability font-mono-code">
      <span class="contact__dot">&bull;</span>
      <span>{{ 'CONTACT.AVAILABLE' | translate }}</span>
    </div>

    <p class="contact__info">
      {{ 'CONTACT.TOUCH_INFO' | translate }}
    </p>

    <div class="contact__actions font-mono-code">
      <button
        type="button"
        id="copy-btn"
        class="btn btn--primary"
        (click)="copyEmail()"
      >
        {{ copied ? ('[COPIED: ' + email + ' ✓]') : ('$ copy ' + email) }}
      </button>

      <a class="btn btn--ghost" [href]="'mailto:' + email">
        &gt; LAUNCH_MAIL_CLIENT()
      </a>
    </div>

    <div class="contact__links font-mono-code">
      <a
        class="contact__social-link phosphor-pill"
        [href]="githubUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub &nearr;
      </a>
      <a
        class="contact__social-link phosphor-pill"
        [href]="linkedinUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn &nearr;
      </a>
    </div>
  </div>
</section>
